    <style>
        :root {
            --bg-color: #030712;
            --gold-primary: #FFD700;
            --gold-glow: #FFA500;
            --gold-gradient: linear-gradient(135deg, #FFF099 0%, #FFD700 50%, #D4AF37 100%);
            --cyber-cyan: #00F3FF;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-glow: rgba(255, 215, 0, 0.3);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 243, 255, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Cyberpunk Grid Overlay */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        /* Top VIP Cyber Badge */
        .cyber-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid var(--border-glow);
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 800;
            color: var(--gold-primary);
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold-primary);
            animation: pulseFast 1s infinite alternate;
        }

        @keyframes pulseFast {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Hologram Profile Frame */
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin-top: 5px;
        }

        .avatar-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--gold-primary), transparent, var(--cyber-cyan), transparent, var(--gold-primary));
            animation: rotateRing 4s linear infinite;
        }

        @keyframes rotateRing {
            100% { transform: rotate(360deg); }
        }

        .avatar-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #030712;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Title Styling */
        .title-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .main-title {
            font-size: 26px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .sub-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ULTRA HIGH CTA BUTTON */
        .cta-wrapper {
            width: 100%;
            position: relative;
            margin-top: 5px;
        }

        .cta-btn {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 24px;
            background: var(--gold-gradient);
            color: #000000;
            font-size: 20px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.5);
            animation: ctaPulse 1.5s infinite;
            overflow: hidden;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transform: rotate(30deg);
            animation: shine 2.5s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        @keyframes ctaPulse {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 45px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); }
        }

        /* High-Tech Timer Box */
        .timer-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .timer-header {
            font-size: 11px;
            font-weight: 800;
            color: var(--cyber-cyan);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .timer-display {
            font-size: 36px;
            font-weight: 900;
            color: var(--gold-primary);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            font-family: monospace;
        }

        /* Stats Card */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .stat-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 8px;
            backdrop-filter: blur(10px);
        }

        .stat-val {
            font-size: 16px;
            font-weight: 800;
            color: var(--gold-primary);
        }

        .stat-lbl {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        /* FOMO Live Join Popup */
        .fomo-popup {
            position: fixed;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--gold-primary);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            animation: popSlide 0.5s ease-out;
            z-index: 10;
            white-space: nowrap;
        }

        @keyframes popSlide {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* Footer */
        .footer {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .footer a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
